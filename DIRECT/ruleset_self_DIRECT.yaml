  # ---- 关于 SMTP：**不要**在本表加 `DOMAIN-KEYWORD,smtp` ----
  # 2026-09-13 加过又撤了。用 17 个国内 + 15 个境外 SMTP 主机做改前/改后归组对比，结论：
  #  · 国内的（163 / qq / exmail.qq / 189 / 139 / sina / sohu / 126 / aliyun / qiye.aliyun /
  #    aliyun-inc / mxhichina / ym.163 / 188 / kingsoft / feishu / coremail）
  #    **本来就全部由 cn-lite 直连** → 关键字对国内**零增量**；
  #  · 而它会静默抢走**境外** SMTP 主机的代理：smtp.gmail.com / smtp-mail.google.com
  #    （原 🔰GooglePlay&Gmini）、smtp-mail.outlook.com / smtp.office365.com（原 😶‍🌫️Windows）、
  #    smtp.yandex.com / smtp.zoho.com / smtp.mail.yahoo.com / smtp.protonmail.ch（原 🥖Proxy）、
  #    smtp.mailgun.org / smtp.sendgrid.net 等（原 ⚓️Other = 🔰US）。
  #    这些从国内直连基本不通（Gmail 尤甚）→ 直接表现为**发信失败**。
  #  · 本表排在全部规则之前，且 rules 里放任何位置都做不到"只覆盖国内未收录的、不误伤境外未收录的"，
  #    所以这个关键字无法安全使用。
  # 如确需让某个具体 SMTP 服务器直连 → 精确写 `- DOMAIN-SUFFIX,<你的邮件域名>`。
  # 同理，原先那条 `DOMAIN-SUFFIX,smtp`（无点号 → 只匹配 *.smtp）也不要再加，它等于不生效。
