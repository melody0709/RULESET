  - DOMAIN-SUFFIX,teamviewer.com
  - DOMAIN-SUFFIX,mousegesturesapi.com

  - DOMAIN-KEYWORD,dbzy  #douban采集

  # --- 微软短链改走代理（2026-09-14 v10.3 §三.4）---
  # 根因：geosite:cn 含 TLD 级宽条目 `ms`，会让所有未命中 gl 的 .ms 域落 DIRECT；
  # 这两条不在 geolocation-!cn 中，故显式钉回本组（本表 = rules 第 32 条，早于 GEOSITE,cn）。
  # 1drv.ms / aka.ms 已在 geolocation-!cn 内，无需处理。
  - DOMAIN,mstea.ms              # Teams 短链
  - DOMAIN,outlookgroups.ms
