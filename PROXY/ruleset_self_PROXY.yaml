  # 整域规则会把 gateway.ai.cloudflare.com、apple-relay.cloudflare.com、
  # cp4.cloudflare.com 一并拖进本组 → 抢跑本该由 ai / GenAI / Apple 接管的域名。
  # 收窄为 Turnstile 人机验证域（保持原出口不变）；其余未收录的 *.cloudflare.com
  # 仍会由 geosite:geolocation-!cn（广义代理兜底，v10.3 起替代 proxy.mrs）落到本组，等价于原行为。
